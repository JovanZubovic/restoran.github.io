<!DOCTYPE html>

<html lang="sr">
<head>
  <meta name="google-site-verification" content="dUOD-pp_SaJQGCgfRDkPFi0vlOjyjx_o4m9xF8EHuYo" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Restaurant Name | Traditional Cuisine in Pančevo</title>

<meta name="description"
     content="Traditional Serbian cuisine, grilled specialties, homemade meals and a pleasant atmosphere in Pančevo.">

<meta name="keywords"
     content="restaurant, Pančevo, Serbian cuisine, grill, lunch, dinner, food">

  <link rel="canonical" href="https://jovanzubovic.github.io/restoran.github.io/">

  <meta property="og:title" content="Restaurant Name">
  <meta property="og:description" content="Traditional Serbian cuisine and grilled specialties.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jovanzubovic.github.io/restoran.github.io/">
  <meta property="og:image" content="https://jovanzubovic.github.io/restoran.github.io/images/image1.jpg">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Restaurant",
    "name": "Restaurant Name",
    "telephone": "+38160123456",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Main Street 12",
      "addressLocality": "Pančevo",
      "addressCountry": "RS"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      color: #333;
    }

    header {
      position: relative;
      text-align: center;
      padding: 60px 20px;
      background: #222;
      color: white;
    }

    .language-select {
      position: absolute;
      top: 20px;
      right: 20px;
    }

    select {
      padding: 5px;
      border-radius: 5px;
      border: none;
    }

    .logo {
      width: 100px;
      height: 100px;
      background: #ccc;
      border-radius: 50%;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 3em;
      margin: 0;
    }

    section {
      padding: 40px 20px;
      max-width: 900px;
      margin: auto;
    }

    h2 {
      font-size: 2em;
      border-bottom: 2px solid #ddd;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      border-radius: 10px;
      object-fit: cover;
      height: 200px;
    }

    .contact p {
      margin: 8px 0;
      font-size: 1.1em;
    }
  </style>

</head>

<body>

<header>
  <div class="language-select">
    <select id="languageSwitcher">
      <option value="sr">SR</option>
      <option value="en">EN</option>
    </select>
  </div>

  <div class="logo"></div>
  <h1 id="welcome"></h1>
</header>

<section>
  <h2 id="aboutTitle"></h2>
  <p id="aboutText"></p>
</section>

<section>
  <h2 id="menuTitle"></h2>
  <table id="menuTable"></table>
</section>

<section>
  <h2 id="galleryTitle"></h2>
  <div class="gallery" id="gallery"></div>
</section>

<section class="contact">
  <h2 id="contactTitle"></h2>
  <p id="contactEmail"></p>
  <p id="contactPhone"></p>
  <p id="contactAddress"></p>
</section>

<script>
  const translations = {
    sr: {
      welcome: "Dobrodošli",

      aboutTitle: "O NAMA",

      aboutText:
        "Naš restoran nudi tradicionalnu srpsku kuhinju, specijalitete sa roštilja, domaća jela i prijatan ambijent za porodične ručkove, proslave i poslovne sastanke.",

      menuTitle: "MENI",
      galleryTitle: "GALERIJA",

      contactTitle: "KONTAKT",
      contactEmail: "Email: restoran@email.com",
      contactPhone: "Telefon: +381 60 123 456",
      contactAddress: "Adresa: Glavna 12, Pančevo",

      menu: [
        { name: "Ćevapi", price: "800 RSD" },
        { name: "Pljeskavica", price: "900 RSD" },
        { name: "Pileći file", price: "950 RSD" },
        { name: "Šopska salata", price: "350 RSD" }
      ]
    },

    en: {
      welcome: "Welcome",

      aboutTitle: "ABOUT US",

      aboutText:
        "Our restaurant offers traditional Serbian cuisine, grilled specialties, homemade meals and a pleasant atmosphere for family lunches, celebrations and business gatherings.",

      menuTitle: "MENU",
      galleryTitle: "GALLERY",

      contactTitle: "CONTACT",
      contactEmail: "Email: restaurant@email.com",
      contactPhone: "Phone: +381 60 123 456",
      contactAddress: "Address: Main Street 12, Pancevo",

      menu: [
        { name: "Ćevapi", price: "€7" },
        { name: "Burger Steak", price: "€8" },
        { name: "Chicken Fillet", price: "€8" },
        { name: "Shopska Salad", price: "€3" }
      ]
    }
  };

  function setLanguage(lang) {
    const t = translations[lang];

    document.getElementById("welcome").textContent = t.welcome;
    document.getElementById("aboutTitle").textContent = t.aboutTitle;
    document.getElementById("aboutText").textContent = t.aboutText;
    document.getElementById("menuTitle").textContent = t.menuTitle;
    document.getElementById("galleryTitle").textContent = t.galleryTitle;

    document.getElementById("contactTitle").textContent = t.contactTitle;
    document.getElementById("contactEmail").textContent = t.contactEmail;
    document.getElementById("contactPhone").textContent = t.contactPhone;
    document.getElementById("contactAddress").textContent = t.contactAddress;

    const table = document.getElementById("menuTable");
    table.innerHTML = "";

    t.menu.forEach(item => {
      const row =
        `<tr>
          <td>${item.name}</td>
          <td>${item.price}</td>
        </tr>`;

      table.innerHTML += row;
    });
  }

  function loadGallery() {
    const gallery = document.getElementById("gallery");

    for (let i = 1; i <= 10; i++) {
        const img = document.createElement("img");

        img.src = `images/image${i}.png`;
        img.alt = `Restaurant photo ${i}`;

        gallery.appendChild(img);
    }
}

  document
    .getElementById("languageSwitcher")
    .addEventListener("change", (e) => {
      setLanguage(e.target.value);
    });

  setLanguage("sr");
  loadGallery();
</script>

</body>
</html>
